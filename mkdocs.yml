site_name: maestro
site_description: maestro - Python helpers for orchestrating embedded Linux and FPGA workflows
site_url: https://spare-logic.github.io/maestro/
site_author: Maestro authors and contributors
repo_name: maestro
repo_url: https://github.com/Spare-Logic/maestro

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI: cli.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Configuration: concepts/configuration.md
      - Executors: concepts/executors.md
      - Logging: concepts/logging.md
  - Guides:
      - Register generation: guides/register-generation.md
      - Vivado and HoG: guides/vivado-and-hog.md
      - RPU firmware: guides/rpu-firmware.md
      - Yocto and Apptainer: guides/yocto-and-apptainer.md
      - GitLab CI: gitlab_ci.md
  - Examples: examples/index.md
  - API reference:
      - Commands: reference/commands.md
      - Executors: reference/executors.md
      - Configuration: reference/config.md
      - Models: reference/models.md
  - Contributing: contributing.md

copyright: Copyright &copy; 2026 Maestro authors and contributors

theme:
  name: material

  # System fonts (Segoe UI / Cascadia) are set in docs/stylesheets/extra.css
  font: false

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to auto mode
      primary: custom
      accent: custom

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.prune
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search
  - social
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            members: true
            show_bases: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.blocks.caption
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

paths:
  root: .maestro

log:
  level: INFO
  subdir: logs
  format: "%(name)s: %(message)s"
  format_file: "%(asctime)s %(name)s %(levelname)s - %(message)s"
  datefmt: "[%X]"
  datefmt_file: "[%Y-%m-%d %H:%M:%S]"

apptainer:
  cache_subdir: apptainer

yocto:
  cache_subdir: yocto

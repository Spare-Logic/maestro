name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check formatting
        run: uv run ruff format --check
      - name: Check lint
        run: uv run ruff check
      - name: Check types
        run: uv run ty check
      - name: Check licenses
        run: uv run reuse lint
      - name: Run tests
        run: uv run pytest --junitxml=logs/report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: logs/report.xml
          if-no-files-found: ignore
      - name: Install documentation system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - name: Build documentation
        run: uv run mkdocs build
      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
          if-no-files-found: error

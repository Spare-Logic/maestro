name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"
      # PyPI versions can't be reused, so refuse to upload if the tag and pyproject disagree
      - name: Check tag matches version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish
